services:
  agendav:
    image: dominikl123/agendav
    container_name: agendav
    restart: unless-stopped
    environment:
      - AGENDAV_SERVER_NAME=127.0.0.1
      - AGENDAV_TITLE=Welcome to Example Agendav Server
      - AGENDAV_CALDAV_SERVER=https://some_caldav_server/
      - AGENDAV_CALDAV_PUBLIC_URL=https://some_caldav_server/
      - AGENDAV_TIMEZONE=Europe/London
      - AGENDAV_LANG=en
      - AGENDAV_WEEKSTART=1
      - AGENDAV_LOG_DIR=/var/www/agendav/var/log/
    ports:
      - "80:8080"
